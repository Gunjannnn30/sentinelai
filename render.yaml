# Render Blueprint — deploy the SentinelAI backend in one click.
#
#   Render dashboard → New → Blueprint → select this repo
#
# Creates ONE resource:
#   sentinelai-api     web service, Docker (infra/Dockerfile.backend)
#
# The database is NOT on Render. It lives on **Neon** (free tier, never
# expires) and the frontend lives on **Vercel** — see README §14. This file
# deliberately provisions no `databases:` block:
#
#   * Render's free Postgres EXPIRES AFTER 30 DAYS, which silently kills a
#     deployment you thought was permanent. Neon's free tier has no expiry.
#   * Render allows only ONE active free-tier Postgres per workspace anyway,
#     so a second project usually cannot provision one at all.
#
# BEFORE YOU RELY ON IT — free-tier caveats (current as of Oct 2026):
#   * Free web services: 512 MB / 0.1 CPU, spin down after 15 min idle
#     (~60 s to wake), drawn from 750 free instance-hours per workspace/month.
#   * No credit card required to start.
#
# Local development is unaffected: `docker compose up` still spins its own
# throwaway Postgres in a container, and plain `uvicorn` uses SQLite.

services:
  # ── API ─────────────────────────────────────────────────────────────────
  - type: web
    name: sentinelai-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    # /ready checks the database, so Render won't route traffic to an
    # instance whose migrations or connection are broken.
    healthCheckPath: /ready
    envVars:
      - key: SENTINEL_APP_ENV
        value: production
      # Generated once and stored by Render — never committed anywhere.
      - key: SENTINEL_AUTH_SECRET
        generateValue: true
      # YOUR Neon connection string goes here. Paste it in the Render
      # dashboard after the Blueprint finishes creating the service —
      # it is marked `sync: false` so Blueprint creation never fails on a
      # value only you can supply, and so Render never writes it to git.
      #
      # Use the DIRECT endpoint (host like `ep-xxx-aws.neon.tech`), NOT the
      # pooled one (`ep-xxx-aws-pooler.neon.tech`). The pooler is PgBouncer in
      # transaction mode, which breaks Alembic's migrations and psycopg3's
      # prepared statements. A long-running uvicorn wants a direct connection.
      #
      # Neon hands out a bare `postgres://` URL; app/core/config.py pins it
      # to the psycopg v3 driver we actually ship, so paste it as-is.
      - key: SENTINEL_DATABASE_URL
        sync: false
      - key: SENTINEL_SESSION_COOKIE_SECURE
        value: "true"
      # Hard production posture — see README §8 and §14.1.
      - key: SENTINEL_ALLOW_DEV_LOGIN
        value: "false"
      # Flip to "true" only if you want the labelled demo org/user seeded on
      # first boot so the console has something to show. Keep "false" for real
      # production data.
      - key: SENTINEL_SEED_DEMO_DATA
        value: "true"
      - key: SENTINEL_STORE_PROMPT_CONTENT
        value: "false"
      - key: SENTINEL_LOG_LEVEL
        value: INFO
      # Left empty on purpose: run mock-only, or add these in the dashboard
      # via Render's secret store for real OpenAI/Anthropic/Gemini calls.
      - key: SENTINEL_OPENAI_API_KEY
        sync: false
